; File: platformio.ini
; Version: 0.1.0
; Date: 2026-09-21
; Purpose: PlatformIO build profiles for the universal GA-WallBox ESP32 firmware.

[platformio]
default_envs = esp32-pulsares

[env]
monitor_speed = 115200
build_flags =
  -D GA_FIRMWARE_VERSION=\"0.1.0\"
  -D GA_RS485_RX_PIN=16
  -D GA_RS485_TX_PIN=17
  -D GA_RS485_DE_PIN=4
  -D GA_CONTROL_LEASE_MS=15000UL
  -D GA_MODBUS_COOLDOWN_MS=7000UL

[env:esp32-pulsares]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  emelianov/modbus-esp8266 @ ^4.1.0
  bblanchon/ArduinoJson @ ^7.4.2
  tzapu/WiFiManager @ ^2.0.17
build_flags =
  ${env.build_flags}
  -D GA_WALLBOX_DRIVER_PULSARES=1
  -D GA_MODBUS_BAUD=9600
  -D GA_MODBUS_SLAVE_ID=2

[env:esp32-heidelberg]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  emelianov/modbus-esp8266 @ ^4.1.0
  bblanchon/ArduinoJson @ ^7.4.2
  tzapu/WiFiManager @ ^2.0.17
build_flags =
  ${env.build_flags}
  -D GA_WALLBOX_DRIVER_HEIDELBERG=1
  -D GA_MODBUS_BAUD=19200
  -D GA_MODBUS_SLAVE_ID=1

[env:native]
platform = native
test_build_src = no
